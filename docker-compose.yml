services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_PATH: /data/ecommerce.db
      AUTH_SECRET: ${AUTH_SECRET:-local-docker-secret-change-before-deployment}
      CUSTOMER_TOKEN_PRIVATE_KEY: ${CUSTOMER_TOKEN_PRIVATE_KEY:-}
      CUSTOMER_TOKEN_ISSUER: ${CUSTOMER_TOKEN_ISSUER:-apexstore}
      SHOP_API_KEYS: ${SHOP_API_KEYS:-}
      PAYMENT_REFUND_URL: ${PAYMENT_REFUND_URL:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_TIMEOUT_MS: ${PAYMENT_TIMEOUT_MS:-8000}
      REFUND_SYNC_SECRET: ${REFUND_SYNC_SECRET:-}
      NOVARETAIL_REFUND_SYNC_URL: ${NOVARETAIL_REFUND_SYNC_URL:-}
      NOVARETAIL_REFUND_SYNC_SECRET: ${NOVARETAIL_REFUND_SYNC_SECRET:-}
      REFUND_SYNC_TIMEOUT_MS: ${REFUND_SYNC_TIMEOUT_MS:-5000}
      ENABLE_TEST_REFUND_ENDPOINT: ${ENABLE_TEST_REFUND_ENDPOINT:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "5000:5000"
    volumes:
      - storefront-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_NOVARETAIL_GATEWAY_URL: ${NEXT_PUBLIC_NOVARETAIL_GATEWAY_URL:-}
        NEXT_PUBLIC_NOVARETAIL_TENANT: ${NEXT_PUBLIC_NOVARETAIL_TENANT:-tenant_novaretail}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storefront-data:

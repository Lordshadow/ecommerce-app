substitutions:
  _REGION: asia-south1
  _AR_REPOSITORY: apexstore-images
  _CLOUD_SQL_INSTANCE: ai-support-assistant-2026:asia-south1:ai-support-db
  _DB_NAME: apexstore
  _DB_USER: apexstore-app
  _BACKEND_SERVICE: apexstore-api
  _FRONTEND_SERVICE: apexstore-web
  _SEED_JOB: apexstore-seed
  _RUN_SEED: 'false'
  _BACKEND_SERVICE_ACCOUNT: apexstore-runtime@ai-support-assistant-2026.iam.gserviceaccount.com
  _DB_PASSWORD_SECRET: apexstore-db-password
  _AUTH_SECRET: apexstore-auth-secret
  _CUSTOMER_TOKEN_PRIVATE_KEY: apexstore-customer-token-private-key
  _SHOP_API_KEYS: apexstore-shop-api-keys
  _SMTP_USER: apexstore-smtp-user
  _SMTP_PASS: apexstore-smtp-pass
  _SMTP_FROM: ApexStore Support

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-api:$BUILD_ID
      - backend

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-api:$BUILD_ID

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-api:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=5000
      - --memory=1Gi
      - --cpu=1
      - --concurrency=10
      - --max=2
      - --timeout=60
      - --service-account=${_BACKEND_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --update-env-vars=NODE_ENV=production,DATABASE_ENGINE=postgres,PGHOST=/cloudsql/${_CLOUD_SQL_INSTANCE},PGPORT=5432,PGDATABASE=${_DB_NAME},PGUSER=${_DB_USER},PGPOOL_MAX=3,CUSTOMER_TOKEN_ISSUER=apexstore,FRONTEND_ORIGIN=https://pending.invalid,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_FROM=${_SMTP_FROM},SMTP_SECURE=false
      - --set-secrets=PGPASSWORD=${_DB_PASSWORD_SECRET}:latest,AUTH_SECRET=${_AUTH_SECRET}:latest,CUSTOMER_TOKEN_PRIVATE_KEY=${_CUSTOMER_TOKEN_PRIVATE_KEY}:latest,SHOP_API_KEYS=${_SHOP_API_KEYS}:latest,SMTP_USER=${_SMTP_USER}:latest,SMTP_PASS=${_SMTP_PASS}:latest

  - id: seed-api-database-on-request
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ '${_RUN_SEED}' == 'true' ]]; then
          gcloud run jobs deploy ${_SEED_JOB} \
            --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-api:$BUILD_ID \
            --region=${_REGION} \
            --service-account=${_BACKEND_SERVICE_ACCOUNT} \
            --set-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
            --set-env-vars=NODE_ENV=production,DATABASE_ENGINE=postgres,PGHOST=/cloudsql/${_CLOUD_SQL_INSTANCE},PGPORT=5432,PGDATABASE=${_DB_NAME},PGUSER=${_DB_USER},PGPOOL_MAX=2 \
            --set-secrets=PGPASSWORD=${_DB_PASSWORD_SECRET}:latest \
            --command=npm --args=run,seed --tasks=1 --parallelism=1 --max-retries=1 --task-timeout=900s
          gcloud run jobs execute ${_SEED_JOB} --region=${_REGION} --wait
        else
          echo 'Skipping seed job. Set _RUN_SEED=true only for the first deployment to a new empty database.'
        fi

  - id: read-api-url
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)' > /workspace/api-url

  - id: read-support-api-url
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - gcloud run services describe assistant-api --region=${_REGION} --format='value(status.url)' > /workspace/support-api-url

  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build \
          --build-arg API_PROXY_TARGET="$$(cat /workspace/api-url)" \
          --build-arg NEXT_PUBLIC_NOVARETAIL_GATEWAY_URL="$$(cat /workspace/support-api-url)" \
          --build-arg NEXT_PUBLIC_NOVARETAIL_TENANT=tenant_novaretail \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-web:$BUILD_ID \
          frontend

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-web:$BUILD_ID

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/apexstore-web:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=1Gi
      - --cpu=1
      - --concurrency=20
      - --max=3
      - --timeout=60

  - id: set-api-cors-origin
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)' > /workspace/web-url
        WEB_URL="$$(cat /workspace/web-url)"
        gcloud run services update ${_BACKEND_SERVICE} --region=${_REGION} --update-env-vars="FRONTEND_ORIGIN=$$WEB_URL"
        SUPPORT_ORIGINS="$$(gcloud run services describe assistant-api --region=${_REGION} --format=json | python3 -c 'import json,sys; data=json.load(sys.stdin); containers=data.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[]); env=containers[0].get("env",[]) if containers else []; print(next((item.get("value","") for item in env if item.get("name")=="WIDGET_ALLOWED_ORIGINS"),""))')"
        if [[ ",$$SUPPORT_ORIGINS," != *",$$WEB_URL,"* ]]; then
          SUPPORT_ORIGINS="$${SUPPORT_ORIGINS:+$$SUPPORT_ORIGINS,}$$WEB_URL"
        fi
        gcloud run services update assistant-api --region=${_REGION} --update-env-vars="^@^WIDGET_ALLOWED_ORIGINS=$$SUPPORT_ORIGINS"
        echo "ApexStore storefront: $$WEB_URL"
        echo "ApexStore API: $$(cat /workspace/api-url)"
        echo "Support API: $$(cat /workspace/support-api-url)"
